services:
  postgres:
    image: postgres:16
    container_name: swasthsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swasthsetu
      POSTGRES_PASSWORD: swasthsetu_dev
      POSTGRES_DB: swasthsetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: